name: sca-cmd pin

# Roku replaces sca-cmd.zip in place. This flags a new upstream build so a
# maintainer can review it and bump the sha256 pinned in scripts/sca.sh; CI
# never runs an unpinned tool.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: [self-hosted, Linux, X64, silo-roku]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the live sca-cmd with the pin
        run: scripts/sca.sh --check-upstream
