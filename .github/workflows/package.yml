name: Package

# Signed Roku packages. Running this workflow by hand makes a beta package; a
# v<major>.<minor> tag (optionally with more after it) makes the release package
# and a draft GitHub Release. Roku signs only on a device, so the sign job runs
# on a self-hosted runner that can reach a Roku in Developer Mode. Upload the
# .pkg to the beta or public app in the Roku Developer Dashboard by hand.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: [self-hosted, Linux, X64, silo-roku]
    timeout-minutes: 10
    outputs:
      variant: ${{ steps.variant.outputs.variant }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Choose the variant
        id: variant
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "zip=out/silo-roku.zip" >> "$GITHUB_OUTPUT"
          else
            echo "variant=beta" >> "$GITHUB_OUTPUT"
            echo "zip=out/silo-roku-beta.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag against the manifest
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major=$(sed -n 's/^major_version=//p' manifest)
          minor=$(sed -n 's/^minor_version=//p' manifest)
          case $TAG in
            "v$major.$minor" | "v$major.$minor".*) ;;
            *) echo "tag $TAG does not match manifest version $major.$minor" >&2; exit 1 ;;
          esac

      - run: npm ci
      - run: npm run build${{ steps.variant.outputs.variant == 'beta' && ':beta' || '' }}

      - name: Stamp build_version from the run number
        run: scripts/stamp-build-version.sh ${{ steps.variant.outputs.zip }}

      - run: scripts/check-size.sh ${{ steps.variant.outputs.zip }}
      - run: scripts/hygiene.sh ${{ steps.variant.outputs.zip }}

      - name: Read the version
        id: version
        run: |
          unzip -p ${{ steps.variant.outputs.zip }} manifest | tr -d '\r' | awk -F= '
            $1 == "major_version" { a = $2 } $1 == "minor_version" { b = $2 } $1 == "build_version" { c = $2 }
            END { print "version=" a "." b "." c }' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip
          path: ${{ steps.variant.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: [self-hosted, roku-signer]
    environment: roku-signing
    timeout-minutes: 15
    # One device signs, and a run rekeys it and replaces its dev app.
    concurrency:
      group: roku-signer
      cancel-in-progress: false
    env:
      PKG: out/silo-roku-${{ needs.build.outputs.variant }}-${{ needs.build.outputs.version }}.pkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zip
          path: ${{ runner.temp }}/zip

      - name: Sign on the Roku
        env:
          ROKU_HOST: ${{ vars.ROKU_HOST }}
          ROKU_DEV_ID: ${{ vars.ROKU_DEV_ID }}
          ROKU_PASSWORD: ${{ secrets.ROKU_PASSWORD }}
          ROKU_SIGN_PASSWORD: ${{ secrets.ROKU_SIGN_PASSWORD }}
          ROKU_SIGN_KEY_BASE64: ${{ secrets.ROKU_SIGN_KEY_BASE64 }}
        run: |
          umask 077
          export ROKU_SIGN_KEY="$RUNNER_TEMP/sign-key.pkg"
          trap 'rm -f "$ROKU_SIGN_KEY"' EXIT
          printf %s "$ROKU_SIGN_KEY_BASE64" | base64 --decode > "$ROKU_SIGN_KEY"
          scripts/package.sh "$RUNNER_TEMP"/zip/*.zip "$PKG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ needs.build.outputs.variant }}-${{ needs.build.outputs.version }}
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Remove the package from the runner
        if: ${{ always() }}
        run: rm -rf out "$RUNNER_TEMP/zip"

  release:
    if: ${{ github.ref_type == 'tag' }}
    needs: [build, sign]
    runs-on: [self-hosted, Linux, X64, silo-roku]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-release-${{ needs.build.outputs.version }}
          path: pkg

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" pkg/*.pkg --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Silo $VERSION" \
            --notes "Roku package $VERSION. Upload the .pkg to the public app in the Roku Developer Dashboard."
