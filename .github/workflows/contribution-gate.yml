name: Contribution gate

# Closes pull requests that fall outside the policy in README.md's Contributing
# section. The rules live in silo-server's reusable-contribution-gate.yml, which
# every Silo app repository calls.

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: contribution-gate-${{ github.event.pull_request.number }}

jobs:
  gate:
    permissions:
      issues: read
      pull-requests: write
    uses: Silo-Server/silo-server/.github/workflows/reusable-contribution-gate.yml@main
    with:
      contributing_url: https://github.com/Silo-Server/silo-roku#contributing
