name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run lint
      - run: npm run check:shadowing
      - run: npm run check:thread-rules
      - run: npm run format:check
      - run: npm run build

      - name: Stamp build_version from the run number
        run: scripts/stamp-build-version.sh

      - run: npm run check:size
      - run: npm run check:hygiene

      - name: Read the pinned sca-cmd hash
        id: sca-pin
        run: echo "sha256=$(scripts/sca.sh --print-pin)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sca-cmd
          key: sca-cmd-${{ steps.sca-pin.outputs.sha256 }}

      - run: npm run check:sca
        env:
          SCA_CMD_CACHE_DIR: ${{ runner.temp }}/sca-cmd

      - run: npm run check:contract
      - run: npm run check:device-check
      - run: npm test -- --junit

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
