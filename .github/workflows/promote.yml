name: Promote

# Turns a tester build into a store release without rebuilding it: drafts the
# GitHub release vX.Y.Z on the build's commit with the store package release.yml
# signed for it, and notes since the last store release. A maintainer uploads
# that package to the public app in the Roku Developer Dashboard, submits it,
# and publishes the GitHub release once Roku approves it. See
# docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tester build to release, for example v1.0.0-beta.12'
        required: true
        type: string

# Shares release.yml's group: a draft changes the next run's version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # draft the release
      actions: read # download the signed package
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BETA_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tester build
        id: build
        run: |
          python3 -I scripts/release-version.py beta "${BETA_TAG}" | tee -a "${GITHUB_OUTPUT}" > build.txt
          release_tag="$(sed -n 's/^release_tag=//p' build.txt)"
          if [[ "$(gh release view "${BETA_TAG}" --json isPrerelease --jq .isPrerelease 2>/dev/null)" != "true" ]]; then
            echo "::error::${BETA_TAG} has no published tester build on GitHub."
            exit 1
          fi
          if gh release view "${release_tag}" > /dev/null 2>&1; then
            echo "::error::${release_tag} already exists (possibly as a draft). Delete the draft to promote again."
            exit 1
          fi
          commit="$(gh api "repos/${GH_REPO}/commits/${BETA_TAG}" --jq .sha)"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          # Notes cover everything since the last store release, if any.
          previous_release="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          echo "previous_release=${previous_release}" >> "${GITHUB_OUTPUT}"

      - name: Download the store package
        env:
          NAME: silo-roku-${{ steps.build.outputs.version }}-${{ steps.build.outputs.build }}
        run: |
          id="$(gh api "repos/${GH_REPO}/actions/artifacts?name=${NAME}" \
            --jq '[.artifacts[] | select(.expired | not)][0].id // ""')"
          if [[ -z "${id}" ]]; then
            echo "::error::The signed package ${NAME} has expired or was never made. Run Release with version: ${{ steps.build.outputs.version }} and promote that build."
            exit 1
          fi
          gh api "repos/${GH_REPO}/actions/artifacts/${id}/zip" > package.zip
          unzip -q package.zip -d pkg
          ls -l pkg
          [[ -s "pkg/${NAME}.pkg" ]] || { echo "::error::${NAME}.pkg is missing from its artifact."; exit 1; }

      - name: Draft the GitHub release
        env:
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          COMMIT: ${{ steps.build.outputs.commit }}
          PREVIOUS_RELEASE: ${{ steps.build.outputs.previous_release }}
        run: |
          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" -f target_commitish="${COMMIT}" \
            ${PREVIOUS_RELEASE:+-f previous_tag_name="${PREVIOUS_RELEASE}"} --jq .body > notes.md
          {
            echo "Silo Roku ${VERSION}, build ${BUILD}: the tester build ${BETA_TAG}, on the Roku Streaming Store."
            echo
            cat notes.md
          } > body.md
          # A draft is visible only to maintainers, so the package stays private.
          gh release create "${RELEASE_TAG}" --draft --target "${COMMIT}" \
            --title "Silo Roku ${VERSION}" --notes-file body.md pkg/*.pkg
          {
            echo "Drafted ${RELEASE_TAG}. Next: upload its .pkg to the public app in the Roku Developer Dashboard and submit it, then publish this release once Roku approves it."
            echo
            echo "Release notes (1,500 characters at most):"
            echo
            python3 -I scripts/release-version.py store-notes 1500 < notes.md | sed 's/^/    /'
          } >> "${GITHUB_STEP_SUMMARY}"
