name: Discord Commit Feed

# Posts each push to main into this repository's post in the Discord commit-feed
# forum. The message format lives in silo-server's reusable-discord-commits.yml,
# which every Silo repository calls.

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  notify:
    permissions:
      contents: read
    uses: Silo-Server/silo-server/.github/workflows/reusable-discord-commits.yml@main
    with:
      thread_id: ${{ vars.DISCORD_COMMITS_THREAD_ID }}
    secrets:
      webhook_url: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
