# Groups the release notes GitHub generates by pull request label, as
# silo-android does. Store notes keep only the Features and Fixes sections
# (scripts/release-version.py). See docs/releasing.md.
changelog:
  categories:
    - title: 🚀 Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
